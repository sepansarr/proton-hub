name: Scheduled Config Sync

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Generator
        env:
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
          PROTON_COOKIE: ${{ secrets.PROTON_COOKIE }}
          PROTON_UID: ${{ secrets.PROTON_UID }}
          PROTON_APPVERSION: ${{ secrets.PROTON_APPVERSION }}
          PROTON_WG_PRIVATE: ${{ secrets.PROTON_WG_PRIVATE }}
        run: python -u scripts/generator.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add servers.js
          git diff --staged --quiet || (git commit -m "chore: sync live configs and vpn credentials [skip ci]" && git push)
