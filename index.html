<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton Hub | پروتون هاب</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="layout">
        <aside class="sidebar">
            <img src="sepansar.jpg" alt="Sepansar Logo" class="logo">
            <img src="iran.png" alt="Iran Flag" class="flag">
            <div class="controls">
                <button id="theme-toggle" class="ios-toggle"></button>
                <button id="lang-toggle">EN</button>
            </div>
            <div class="input-group">
                <label id="lbl-prefix">پیشوند:</label>
                <input type="text" id="prefix-input">
            </div>
            <div class="protocols">
                <div class="card" id="proto-wg">وایرگارد</div>
                <div class="card" id="proto-udp">اوپن وی‌پی‌ان UDP</div>
                <div class="card" id="proto-tcp">اوپن وی‌پی‌ان TCP</div>
            </div>
        </aside>
        <main class="main-content">
            <header class="live-metrics">
                <h1 id="lbl-title">پروتون هاب</h1>
                <span id="sync-status">در حال همگام‌سازی...</span>
            </header>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="جستجوی سرورها...">
            </div>
            <div id="server-list" class="accordion">
                <div id="loading-indicator">در حال بارگذاری داده‌ها...</div>
            </div>
        </main>
    </div>
    <script src="./servers.js"></script>
    <script src="./app.js"></script>
</body>
</html>
