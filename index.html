<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پروتون هاب | Proton Hub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="layout-wrapper">
    <aside class="dashboard-sidebar">
      <div class="brand-showcase">
        <div class="brand-avatar-box">
          <img src="sepansar.jpg" alt="Sepansar" class="brand-img-logo">
        </div>
        <div class="brand-headings">
          <span class="brand-core-title" id="txt-brand-title">پروتون هاب</span>
          <span class="brand-tagline" id="tag-cloud">ژنراتور رسمی سرورها</span>
        </div>
      </div>

      <div class="sidebar-item">
        <div class="ios-switch-row">
          <span id="txt-theme-label" class="setting-title">حالت نمایش</span>
          <div class="capsule-toggle">
            <input type="checkbox" id="theme-ios-checkbox" class="capsule-input">
            <label for="theme-ios-checkbox" class="capsule-slider">
              <span class="capsule-knob">
                <svg class="sun-glyph" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/></svg>
                <svg class="moon-glyph" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              </span>
            </label>
          </div>
        </div>
      </div>

      <div class="sidebar-item">
        <label id="txt-lang-label" class="setting-title">زبان سامانه</label>
        <div class="bilingual-switch">
          <button type="button" id="btn-fa" class="btn-lang active">
            <img src="iran.png" alt="ایران" class="lion-sun-flag">
            پارسی
          </button>
          <button type="button" id="btn-en" class="btn-lang">English</button>
        </div>
      </div>

      <div class="sidebar-item">
        <label id="lbl-custom-prefix" class="setting-title">پیشوند نام کانفیگ</label>
        <div class="prefix-input-field">
          <input type="text" id="custom-prefix" value="Sepansar" class="input-text-core" spellcheck="false">
          <button type="button" id="btn-apply-prefix" class="btn-primary-apply">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="txt-apply">اعمال</span>
          </button>
        </div>
      </div>

      <div class="sidebar-item">
        <label id="lbl-protocol" class="setting-title">پروتکل خروجی</label>
        <div class="protocol-selection-stack">
          <button type="button" class="proto-card active" data-proto="wireguard">
            <div class="proto-meta">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              <span id="txt-proto-wg">وایرگارد (WireGuard)</span>
            </div>
            <span class="file-ext-tag">.conf</span>
          </button>
          <button type="button" class="proto-card" data-proto="openvpn-udp">
            <div class="proto-meta">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>
              <span id="txt-proto-udp">اوپن‌وی‌پی‌ان (UDP)</span>
            </div>
            <span class="file-ext-tag">.ovpn</span>
          </button>
          <button type="button" class="proto-card" data-proto="openvpn-tcp">
            <div class="proto-meta">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>
              <span id="txt-proto-tcp">اوپن‌وی‌پی‌ان (TCP)</span>
            </div>
            <span class="file-ext-tag">.ovpn</span>
          </button>
        </div>
      </div>

      <footer class="sidebar-credit">
        <div class="developer-box">
          <img src="sepansar.jpg" alt="sepansar" class="dev-logo-img">
          <span class="developer-name">sepansar</span>
        </div>
        <p class="copyright-own" id="txt-footer-own">طراحی و توسعه توسط <a href="https://github.com/sepansarr" target="_blank" rel="noopener noreferrer">سپنسار</a></p>
        <p class="disclaimer-note" id="txt-footer-disclaimer">این پروژه مستقل بوده و هیچ‌گونه وابستگی تجاری به Proton AG ندارد.</p>
      </footer>
    </aside>

    <main class="content-area">
      <header class="content-header">
        <div class="header-titles">
          <h1 id="txt-main-title">سرورهای رسمی پروتون</h1>
          <p id="txt-main-subtitle">فهرست کانفیگ‌های فعال با محاسبه بار زنده شبکه</p>
        </div>
        <div class="header-status-strip">
          <div class="status-indicator-pill">
            <span class="indicator-pulse"></span>
            <span id="status-counter">در حال دریافت داده‌ها...</span>
          </div>
          <div id="full-counter-badge" class="alert-indicator-pill" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="full-counter-text">0 سرور پر (100%)</span>
          </div>
          <button type="button" id="btn-reload" class="btn-iconic-reload" title="تازه‌سازی سرورها">
            <svg id="reload-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
        </div>
      </header>

      <div class="filter-bar">
        <div class="search-input-shell">
          <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-box" placeholder="جستجوی کشور یا نام سرور...">
        </div>
      </div>

      <div class="table-wrapper"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="servers.js"></script>
  <script src="app.js"></script>
</body>
</html>
