<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>پروتون هاب | Proton Hub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-title" id="txt-brand-title">پروتون هاب</span>
          <span class="brand-badge" id="tag-cloud">ژنراتور پیشرفته کانفیگ</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="theme-capsule-wrap">
          <span id="txt-theme-label" class="section-label">حالت نمایش</span>
          <div class="ios-switch-container">
            <input type="checkbox" id="theme-ios-checkbox" class="ios-checkbox">
            <label for="theme-ios-checkbox" class="ios-capsule">
              <span class="ios-thumb">
                <svg class="sun-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/></svg>
                <svg class="moon-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              </span>
            </label>
          </div>
        </div>
      </div>

      <div class="nav-section">
        <label id="txt-lang-label" class="section-label">زبان سامانه</label>
        <div class="lang-toggle">
          <button type="button" id="btn-fa" class="lang-opt active">
            <svg class="lion-sun-flag" viewBox="0 0 36 24" width="20" height="14" style="border-radius:2px; vertical-align:middle; margin-left:4px;">
              <rect width="36" height="8" fill="#239f40"/>
              <rect y="8" width="36" height="8" fill="#ffffff"/>
              <rect y="16" width="36" height="8" fill="#da0000"/>
              <circle cx="18" cy="12" r="3.2" fill="#ffd700"/>
              <path d="M15 13.5 Q18 10 21 13.5 Z" fill="#b8860b"/>
            </svg>
            پارسی
          </button>
          <button type="button" id="btn-en" class="lang-opt">English</button>
        </div>
      </div>

      <div class="nav-section">
        <label id="lbl-custom-prefix" class="section-label">پیشوند نام کانفیگ</label>
        <div class="prefix-input-wrap">
          <input type="text" id="custom-prefix" value="Sepansar" class="custom-input">
          <button type="button" id="btn-apply-prefix" class="btn-apply">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="txt-apply">اعمال</span>
          </button>
        </div>
      </div>

      <div class="nav-section">
        <label id="lbl-protocol" class="section-label">پروتکل خروجی</label>
        <div class="protocol-grid">
          <button type="button" class="proto-card active" data-proto="wireguard">
            <div class="proto-header">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              <span class="proto-title" id="txt-proto-wg">وایرگارد (WireGuard)</span>
            </div>
            <span class="proto-ext">.conf</span>
          </button>
          <button type="button" class="proto-card" data-proto="openvpn-udp">
            <div class="proto-header">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
              <span class="proto-title" id="txt-proto-udp">اوپن‌وی‌پی‌ان (UDP)</span>
            </div>
            <span class="proto-ext">.ovpn</span>
          </button>
          <button type="button" class="proto-card" data-proto="openvpn-tcp">
            <div class="proto-header">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
              <span class="proto-title" id="txt-proto-tcp">اوپن‌وی‌پی‌ان (TCP)</span>
            </div>
            <span class="proto-ext">.ovpn</span>
          </button>
        </div>
      </div>

      <footer class="sidebar-footer">
        <p class="copyright-own" id="txt-footer-own">طراحی و توسعه توسط <a href="https://github.com/sepansarr" target="_blank" rel="noopener noreferrer">سپنسار</a></p>
        <p class="disclaimer" id="txt-footer-disclaimer">این پروژه مستقل بوده و هیچ‌گونه وابستگی تجاری به Proton AG ندارد.</p>
      </footer>
    </aside>

    <main class="content-area">
      <header class="content-header">
        <div class="header-titles">
          <h1 id="txt-main-title">سرورهای رسمی پروتون</h1>
          <p id="txt-main-subtitle">فهرست کانفیگ‌های فعال با محاسبه بار زنده شبکه</p>
        </div>
        <div class="stats-group">
          <div class="stats-pill">
            <span class="live-indicator"></span>
            <span id="status-counter">در حال دریافت داده‌ها...</span>
          </div>
          <div id="full-counter-badge" class="full-pill" style="display: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="full-counter-text">0 سرور پر (100%)</span>
          </div>
          <button type="button" id="btn-reload" class="reload-btn" title="تازه‌سازی سرورها">
            <svg id="reload-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          </button>
        </div>
      </header>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-box" placeholder="جستجوی کشور یا نام سرور...">
        </div>
      </div>

      <div class="table-wrapper"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="servers.js"></script>
  <script src="app.js"></script>
</body>
</html>
